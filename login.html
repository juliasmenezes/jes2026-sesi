<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E10600">
  <title>JES 2026 — Área do organizador</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute('data-turno', localStorage.getItem('jes2026_categoria') || 'manha');</script>
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-hero" aria-hidden="true">
      <img src="img/logo.png" alt="">
      <h1>Mesa de jogo<br>JES 2026</h1>
      <p>Placar, lances e classificação em tempo real para quem comanda a quadra.</p>
    </section>

    <section class="login-card">
      <div class="login-top">
        <a class="back-link" href="home.html"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Voltar ao site</a>
        <div id="login-turno"></div>
      </div>
      <h2>Entrar no painel</h2>
      <p class="muted">Use o e-mail e a senha de organizador ou mesário.</p>

      <form id="login-form" novalidate>
        <label class="field"><span>E-mail</span>
          <input type="email" id="email" autocomplete="email" placeholder="voce@email.com" required></label>
        <label class="field"><span>Senha</span>
          <div class="pw">
            <input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" required>
            <button type="button" id="toggle-senha" aria-label="Mostrar senha"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </label>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg btn-submit"><span>Entrar no painel</span></button>
      </form>
    </section>
  </main>

  <script type="module" src="js/firebase-setup.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var box = document.getElementById('login-turno');
      box.innerHTML = JESUI.turnoSwitchHTML(); JESUI.bindTurnoSwitch(box);
      window.addEventListener('jes2026-categoria-changed', JESUI.syncTurnoSwitches);
    });
  </script>
  <script src="js/login.js"></script>
</body>
</html>
